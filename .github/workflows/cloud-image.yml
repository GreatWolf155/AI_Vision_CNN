# Builds the cloud version (Dockerfile) on every push and stores it in GitHub's container registry
# (ghcr.io/greatwolf155/cnn-vision, public), which Cloud Run deploys from. Free for public images.
name: Build the cloud image

on:
  push:
    branches: [main]
    paths-ignore: ["reference work.ipynb", "**.md", "**.pdf"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/greatwolf155/cnn-vision:latest
            ghcr.io/greatwolf155/cnn-vision:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/GreatWolf155/AI_Vision_CNN
          cache-from: type=gha
          cache-to: type=gha,mode=max
