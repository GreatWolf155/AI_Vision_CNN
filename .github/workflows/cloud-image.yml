# Builds the cloud version (Dockerfile) on every push and stores it on Docker Hub, where Cloud Run runs it from.
# Needs the repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write).
name: Build the cloud image

on:
  push:
    branches: [main]
    paths-ignore: ["reference work.ipynb", "**.md", "**.pdf"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cnn-vision:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cnn-vision:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
